  default_symbol: "@TY"
  expected_minutes: 1440
  allow_other_minutes: false
  timezone: UTC
  timeframe: 1d
  periods_per_year: 252
  use_file_metadata_symbol: true
  use_file_metadata_timezone: false
  drop_zero_volume: false
  drop_bad_rows: false
  symbol_priority: [filename, binary_metadata, config]

universe:
  # Every strategy is evaluated on every symbol here (see src/universe.py).
  symbols: all
  # Near-duplicate contract variants of the same market (they would count the
  # same bet 2-3x in the score).
  exclude: ["@FGBX=105XC", "@LJ=124XC", "@LZ=104XC", "@UB=120XC"]
  min_bars: 2500
  # Data-quality filters: percent-based logic is meaningless on back-adjusted
  # series that go negative (cocoa, heating oil, RBOB, soy meal, gasoil...).
  max_nonpositive_frac: 0.0005
  max_big_move_frac: 0.003
  max_symbols: null
  # Quick pre-screen: evaluate this many group-diverse symbols first and stop
  # if the strategy is clearly bad there (saves most of the backtest time).
  probe_symbols: 12
  probe_min_median_sharpe: -0.05
  probe_min_pct_positive: 0.45
  # Probe symbols trading less than this fraction of min_trades_per_year are rejected early.
  probe_min_tpy_fraction: 0.4
  max_eval_seconds: 90
  # A strategy is ACCEPTED (saved + holdout-checked) when, over the symbols:
  accept:
    min_pass_rate: 0.08      # share of symbols clearing every walk-forward criterion in `validation`
    min_pct_positive: 0.60   # share of symbols with positive average fold Sharpe
    min_score: 0.15          # frequency-adjusted mean (clipped) per-symbol average fold Sharpe
    min_trades_per_year: 10  # mean trades/yr per symbol; below this the score is scaled down by tpy/10
    fitness_pass_weight: 0.4 # searches maximise fitness = score + weight * (share of symbols passing every criterion)

instruments:
  "@TY":
    exchange: CME
    description: 10-Year Treasury Note Futures
    currency: USD
    point_value: 1000.0
    tick_size: 0.015625
    continuous_contract: true
    roll_adjustment: none

backtest:
  initial_capital: 100000
  # Per-symbol capital = max(initial_capital, capital_per_notional * median
  # 1-contract notional): keeps sizing/drawdown comparable between a $20k
  # grain contract and a $350k index contract. 0 = always initial_capital.
  capital_per_notional: 2.0
  cost_model: futures
  fee_bps: 0
  slippage_bps: 0
  commission_per_side_usd: 2.0
  slippage_ticks: 1
  execution: next_bar_open
  allow_short: true
  stop_loss_pct_default: 0.02
  take_profit_pct_default: 0.04
  position_sizing: risk_based_contracts
  risk_per_trade: 0.01
  default_contracts: 1
  max_contracts: 5
  allow_fractional_contracts: false

validation:
  num_folds: 6
  # Frequency is part of validity: a "strategy" firing 2-5 times a year is a
  # handful of lucky positions. Every fold must hold at least
  # max(min_trades_per_fold, min_trades_per_year * fold_years) trades
  # (10/yr over ~4-year folds = 40+ per fold, hundreds per symbol overall).
  min_trades_per_fold: 10
  min_trades_per_year: 10
  min_avg_fold_sharpe: 0.3
  min_fold_sharpe_floor: -0.2
  min_sharpe_consistency: 0.3
  max_fold_drawdown: 0.35
  min_avg_profit_factor: 1.0

llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  # Tried in order (then auto-discovered free models). The client re-orders
  # them on the fly: rate-limited models cool down, flaky ones are demoted.
  models:
    - poolside/laguna-s-2.1:free
    - nvidia/nemotron-3-super-120b-a12b:free
  use_only_free_models: true
  allow_paid_fallback: false
  # Reasoning-style models spend the output budget on hidden thinking (100-290s
  # calls, 0-1 usable strategies out of 10 in real runs). Skipped unless nothing
  # else is available. Substring match on the model id.
  avoid_models: ["-r1", "thinking", "reasoning"]
  # Free accounts get ~50 requests/DAY account-wide (1000 with $10 credit), so
  # the number of strategies per REQUEST is what matters: 10-12 per call
  # => ~500-600 strategies/day on the free tier. For unlimited volume use a
  # cheap paid model (set use_only_free_models: false and list it first);
  # one iteration then costs a few cents.
  strategies_per_call: 10
  parents_per_call: 2
  variants_per_parent: 3
  concurrency: 3
  tokens_per_strategy: 330
  max_tokens: 6000
  explore_temperature: 0.9
  evolve_temperature: 0.6
  temperature: 0.7
  reasoning_effort: low
  # Stop the run once total LLM spend reaches this many USD. null = no cap.
  max_cost_usd: null
  auto_discover_free_models: true
  max_free_models: 20
  max_retries: 2
  timeout_seconds: 120
  retry_wait_seconds: 3
  # A 429'd model is skipped for this long instead of being re-hit each call.
  rate_limit_cooldown_seconds: 60
  max_cooldown_wait_seconds: 90
  request_headers:
    HTTP-Referer: https://localhost/local-quant-ai
    X-Title: local_quant_ai

memory:
  # Cross-run learning store (see src/memory.py): survives across separate
  # `python main.py run` invocations, so each run continues where the last
  # one left off instead of starting blind.
  path: results/memory/state.json

logging:
  level: INFO
  file: logs/local_quant_ai.log
