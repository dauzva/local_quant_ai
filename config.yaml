run:
  name: local_quant_run
  # 0 = run until max_minutes / LLM quota / budget is exhausted (auto mode).
  iterations: 10
  max_minutes: null
  # Each iteration fires these LLM requests concurrently. EXPLORE = fresh
  # theme-seeded strategies in bulk; EVOLVE = send the best strategies found so
  # far back to the LLM with their per-asset-class results + diagnosis.
  # Strategies per iteration ~= explore * strategies_per_call
  #                           + evolve * parents_per_call * variants_per_parent.
  explore_calls_per_iteration: 4
  evolve_calls_per_iteration: 2
  # ---- zero-token learning (src/tuner.py + src/mutation.py) ----
  # After each iteration, the best strategies (this iteration's + leaderboard) are
  # evolved locally for `tune_seconds`: each step evaluates `tune_candidates`
  # mutated variants (parameters, stop/target, drop/invert a leg, trend/vol/ADX
  # filters, time stop...) on the whole universe in parallel and promotes the best
  # one if it beats its parent by `tune_min_gain`. Operator choice follows the
  # diagnosis of the parent and each operator's measured success rate.
  tune_seconds: 60
  tune_top_k: 6
  tune_candidates: 16
  tune_patience: 2
  tune_min_gain: 0.005
  tune_workers: 16
  # Classic strategy templates with random parameters: free candidates every
  # iteration (x3 when running offline) so the local search always has parents.
  seed_samples_per_iteration: 10
  # If the LLM quota/key dies, keep going with seeds + local search.
  offline_fallback: true
  # At the end of a run the top N strategies by score are written to
  # results/<run_id>/strategies/ (accepted or not).
  save_top_n: 10
  random_seed: 42

